<a
  [routerLink]="href"
  class="group/btn inline-flex shrink-0 items-center justify-center gap-2 rounded-full leading-none whitespace-nowrap transition-[background-color,border-color,filter,transform,box-shadow] duration-300 ease-soft active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-purple-600"
  [ngClass]="[variants[variant], sizes[size], className]"
>
  @if (variant === 'glow') {
    <span
      aria-hidden="true"
      class="absolute inset-0 bg-[linear-gradient(110deg,var(--navy)_0%,var(--purple-600)_50%,var(--navy)_100%)] bg-[length:200%_100%] opacity-0 transition-opacity duration-500 group-hover/glow:opacity-100 group-hover/glow:[animation:gradient-pan_3s_ease-in-out_infinite] group-focus-visible/glow:opacity-100"
    ></span>
  }
  <span class="relative"><ng-content></ng-content></span>

  @if (arrow) {
    <svg
      class="relative transition-transform duration-300 ease-soft group-hover/btn:-translate-x-1 group-focus-visible/btn:-translate-x-1 w-4 h-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
    >
      <path
        d="M19 12H5M12 19l-7-7 7-7"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }
</a>
