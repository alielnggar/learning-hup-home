@if (isOpen) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-navy/60 p-4 backdrop-blur-sm"
    dir="rtl"
    (click)="close.emit()"
  >
    <div
      class="relative w-full max-w-md overflow-hidden rounded-[32px] bg-white p-8 shadow-2xl transition-all"
      (click)="$event.stopPropagation()"
      data-aos="zoom-in"
      data-aos-duration="300"
    >
      <button
        type="button"
        (click)="close.emit()"
        class="absolute left-6 top-6 flex size-8 items-center justify-center rounded-full bg-neutral-ground text-neutral-arrow transition-colors hover:bg-neutral-line hover:text-navy"
      >
        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>

      <div class="mb-8 flex flex-col items-start gap-2">
        <span
          class="inline-flex items-center justify-center rounded-full bg-violet-100 px-3 py-1 text-[11px] font-bold text-purple-600"
        >
          خطوة أخيرة
        </span>
        <h3 class="text-2xl font-bold text-navy">بيانات التسجيل</h3>
        <p class="text-[14px] text-neutral-text">أدخل بياناتك للمتابعة إلى بوابة الدفع الآمنة.</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label for="name" class="text-sm font-bold text-navy">الاسم الكامل</label>
          <div class="relative flex items-center">
            <svg
              class="absolute right-4 size-5 text-neutral-arrow"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <input
              type="text"
              id="name"
              name="name"
              [(ngModel)]="name"
              required
              placeholder="محمد أحمد"
              class="h-12 w-full rounded-xl border border-neutral-line bg-neutral-ground px-11 text-sm text-navy outline-none transition-colors focus:border-purple-600 focus:bg-white"
            />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-sm font-bold text-navy">البريد الإلكتروني</label>
          <div class="relative flex items-center">
            <svg
              class="absolute right-4 size-5 text-neutral-arrow"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              />
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              [(ngModel)]="email"
              required
              placeholder="name@example.com"
              dir="ltr"
              class="h-12 w-full rounded-xl border border-neutral-line bg-neutral-ground px-11 text-right text-sm text-navy outline-none transition-colors focus:border-purple-600 focus:bg-white"
            />
          </div>
        </div>

        @if (errorMessage()) {
          <div class="mt-2 rounded-lg bg-red-50 p-3 text-sm text-red-600">
            {{ errorMessage() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="isLoading()"
          class="mt-4 flex h-14 w-full cursor-pointer items-center justify-center gap-2 rounded-full bg-navy px-8 text-[15px] font-bold text-white shadow-md transition-transform hover:scale-[1.02] hover:bg-purple-600 disabled:opacity-70 disabled:hover:scale-100 disabled:hover:bg-navy"
        >
          @if (isLoading()) {
            <svg class="size-5 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            <span>جاري التحويل...</span>
          } @else {
            <span>انتقل إلى الدفع</span>
            <svg class="size-5 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M14 5l7 7m0 0l-7 7m7-7H3"
              />
            </svg>
          }
        </button>

        <p class="mt-2 text-center text-xs text-neutral-arrow">
          بمتابعتك، أنت توافق على شروط وأحكام DPC. الدفع آمن ومشفّر.
        </p>
      </form>
    </div>
  </div>
}
