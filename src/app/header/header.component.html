<header class="fixed inset-x-0 top-0 z-50 px-4 pt-3 pb-3 md:px-6 lg:pt-5 lg:pb-4" dir="rtl" data-aos="fade-up">
  <div
    aria-hidden="true"
    class="pointer-events-none absolute inset-0 -z-10 bg-white/10 backdrop-blur-[6px] backdrop-saturate-150 transition-opacity duration-300 ease-soft [mask-image:linear-gradient(to_bottom,#000_75%,transparent)]"
    [class.opacity-100]="scrolled()"
    [class.opacity-0]="!scrolled()"
  ></div>

  <div
    class="mx-auto flex h-16 max-w-[1280px] items-center justify-between rounded-full border border-neutral-line bg-white pr-6 pl-4 transition-shadow duration-300 ease-soft lg:h-[88px]"
    [ngClass]="
      scrolled()
        ? 'shadow-[0_8px_24px_rgba(33,25,81,0.1)]'
        : 'shadow-[0_12px_16px_rgba(33,25,81,0.07)]'
    "
  >
    <app-logo></app-logo>

    <div class="hidden lg:block">
      <app-navbar></app-navbar>
    </div>

    <div class="flex items-center gap-2 px-1 lg:w-[200px] lg:justify-end lg:px-3">
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="flex size-11 items-center justify-center rounded-full border border-neutral-border bg-white text-navy lg:hidden"
      >
        @if (!mobileOpen()) {
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
        @if (mobileOpen()) {
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>

      <a
        routerLink="/search"
        aria-label="بحث"
        class="flex items-center justify-center rounded-full border border-neutral-border bg-white text-navy transition-all duration-300 size-11 hover:bg-[#f0edfb]"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          stroke-width="1.458"
        >
          <path
            d="M9.16667 15.8333C12.8486 15.8333 15.8333 12.8486 15.8333 9.16667C15.8333 5.48477 12.8486 2.5 9.16667 2.5C5.48477 2.5 2.5 5.48477 2.5 9.16667C2.5 12.8486 5.48477 15.8333 9.16667 15.8333Z"
          ></path>
          <path d="M17.5 17.5L13.9167 13.9167"></path>
        </svg>
      </a>

      <a
        routerLink="/login"
        class="hidden h-10 items-center rounded-full bg-navy px-4 text-base font-medium whitespace-nowrap text-white transition-colors hover:bg-purple-600 sm:flex"
      >
        تسجيل الدخول
      </a>
    </div>
  </div>

  @if (mobileOpen()) {
    <div
      class="mx-auto mt-2 max-h-[85vh] max-w-[1280px] overflow-y-auto rounded-[24px] border border-neutral-line bg-white/95 p-4 shadow-[0_18px_36px_-6px_rgba(33,25,81,0.14)] backdrop-blur-xl lg:hidden"
    >
      <nav class="flex flex-col space-y-1">
        @for (item of navItems; track item.label) {
          <!-- الروابط العادية -->
          @if (!item.menu) {
            <a
              [routerLink]="item.href"
              (click)="toggleMobileMenu()"
              class="block rounded-xl px-4 py-3.5 text-[17px] font-bold text-navy transition-colors hover:bg-neutral-ground hover:text-purple"
            >
              {{ item.label }}
            </a>
          }

          @if (item.menu) {
            <div>
              <button
                (click)="toggleMobileSubmenu(item.menu)"
                class="flex w-full items-center justify-between rounded-xl px-4 py-3.5 text-[17px] font-bold text-navy transition-colors hover:bg-neutral-ground hover:text-purple"
              >
                <span>{{ item.label }}</span>
                <svg
                  [class.rotate-180]="openMobileMenu() === item.menu"
                  class="size-4 text-neutral-arrow transition-transform duration-200"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </button>

              @if (openMobileMenu() === item.menu) {
                <div class="flex flex-col gap-1 px-2 py-1">
                  @for (sub of menus[item.menu]; track sub.href) {
                    <a
                      [routerLink]="sub.href"
                      (click)="toggleMobileMenu()"
                      class="group flex items-start gap-3.5 rounded-2xl p-3 transition-colors hover:bg-neutral-ground"
                    >
                      <span
                        class="flex size-11 shrink-0 items-center justify-center rounded-xl"
                        [style.backgroundColor]="sub.bg"
                      >
                        <img [src]="'/figma/home-v2/' + sub.icon" alt="" width="24" height="24" />
                      </span>
                      <div class="pt-0.5 min-w-0">
                        <h4
                          class="text-[15px] font-bold text-navy transition-colors group-hover:text-purple"
                        >
                          {{ sub.title }}
                        </h4>
                        <p class="mt-0.5 text-[13px] leading-relaxed text-neutral-text truncate">
                          {{ sub.body }}
                        </p>
                      </div>
                    </a>
                  }

                  <a
                    [routerLink]="item.menu === 'tools' ? '/tools' : '/indicators'"
                    (click)="toggleMobileMenu()"
                    class="mt-1 block px-3 py-2 text-[14.5px] font-bold text-purple transition-colors hover:text-purple-600"
                  >
                    {{ footerLabel[item.menu] }} &larr;
                  </a>
                </div>
              }
            </div>
          }
        }
      </nav>
    </div>
  }
</header>
