<footer class="relative" dir="rtl">
  <div
    class="bg-[linear-gradient(121deg,#fff_0%,var(--violet-100)_50%,var(--sky-100)_100%)] pt-[68px] pb-6 lg:bg-[linear-gradient(169deg,#fff_0%,var(--violet-100)_50%,var(--sky-100)_100%)]"
  >
    <div class="mx-auto flex max-w-[1312px] flex-col gap-10 px-6 lg:gap-[54px] xl:px-0">
      <div class="flex flex-col gap-8 lg:flex-row lg:gap-[42px] justify-between">
       
        <div class="flex flex-col items-start gap-4 lg:w-[340px] lg:shrink-0">
          <app-logo></app-logo>
          <p class="max-w-[340px] text-base leading-[1.8] text-neutral-text">
            معرفة وممارسة تساعد الأفراد والفرق على بناء وتشغيل منتجات رقمية أفضل.
          </p>
        </div>

       
        @for (col of columns; track col.title) {
          <div class="flex flex-col items-start gap-[9px] lg:flex-1">
            <h3 class="pb-1 text-base leading-none font-bold text-navy">{{ col.title }}</h3>

            @for (l of col.links; track l.label) {
              @if (!l.external) {
                <a
                  [routerLink]="l.href"
                  class="relative w-fit transition-colors duration-300 after:absolute after:right-0 after:-bottom-0.5 after:h-px after:w-full after:origin-right after:scale-x-0 after:bg-current after:transition-transform after:duration-300 after:ease-[var(--ease-out-soft)] hover:text-navy hover:after:scale-x-100 text-sm leading-[1.7] text-neutral-text"
                >
                  {{ l.label }}
                </a>
              } @else {
                <a
                  [href]="l.href"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="relative w-fit transition-colors duration-300 after:absolute after:right-0 after:-bottom-0.5 after:h-px after:w-full after:origin-right after:scale-x-0 after:bg-current after:transition-transform after:duration-300 after:ease-[var(--ease-out-soft)] hover:text-navy hover:after:scale-x-100 text-sm leading-[1.7] text-neutral-text"
                >
                  <span dir="ltr" class="inline-flex items-center gap-1">
                    {{ l.label }}
                    <span aria-hidden="true">↗</span>
                  </span>
                </a>
              }
            }
          </div>
        }
      </div>

     
      <div
        class="flex flex-col items-start gap-3 border-t border-neutral-border pt-[22px] text-xs leading-[1.6] md:flex-row md:items-center md:justify-between"
      >
        <span dir="ltr" class="text-neutral-arrow">© DPC Consulting</span>
        <div class="flex gap-4 text-neutral-text">
          @for (l of legal; track l) {
            <a
              href="#"
              class="relative w-fit transition-colors duration-300 after:absolute after:right-0 after:-bottom-0.5 after:h-px after:w-full after:origin-right after:scale-x-0 after:bg-current after:transition-transform after:duration-300 after:ease-[var(--ease-out-soft)] hover:text-navy hover:after:scale-x-100"
            >
              {{ l }}
            </a>
          }
        </div>
      </div>
    </div>
  </div>
</footer>
