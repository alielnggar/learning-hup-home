<nav aria-label="القائمة الرئيسية" class="hidden lg:block" dir="rtl" >
  <ul class="flex items-center gap-[2px]">
    @for (item of navItems; track item.label) {
      
      @if (!item.menu) {
        <li>
          <a
            [routerLink]="item.href"
            [class.bg-[#f0edfb]]="isActive(item.href)"
            class="flex items-center gap-1 rounded-full px-[11px] py-2 text-base leading-none font-medium text-navy transition-colors duration-300 hover:bg-[#f0edfb] focus-visible:bg-[#f0edfb]"
          >
            {{ item.label }}
          </a>
        </li>
      }

    
      @if (item.menu) {
        <li class="relative" (mouseenter)="openMenu.set(item.menu)" (mouseleave)="closeMenu()">
          <button
            type="button"
            (click)="toggleMenu(item.menu)"
            [class.bg-[#f0edfb]]="isActive(item.href) || openMenu() === item.menu"
            class="flex items-center gap-1 rounded-full px-[11px] py-2 text-base leading-none font-medium text-navy transition-colors duration-300 hover:bg-[#f0edfb] focus-visible:bg-[#f0edfb]"
          >
            {{ item.label }}
            <svg
              [class.rotate-180]="openMenu() === item.menu"
              class="transition-transform duration-200 w-4 h-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path
                d="M6 9l6 6 6-6"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          
          @if (openMenu() === item.menu) {
            <div
              class="absolute top-full right-1/2 z-10 translate-x-1/2 pt-3 transition-opacity duration-200"
            >
              <div
                class="w-[340px] rounded-[20px] border border-neutral-border bg-white p-2.5 shadow-[0_18px_20px_rgba(33,26,82,0.14)]"
              >
                <ul class="flex flex-col gap-1">
                  @for (sub of menus[item.menu]; track sub.href) {
                    <li>
                      <a
                        [routerLink]="sub.href"
                        (click)="closeMenu()"
                        class="flex items-center gap-3.5 rounded-[14px] px-3.5 py-3 transition-colors hover:bg-neutral-ground focus-visible:bg-neutral-ground"
                      >
                        <span
                          class="flex size-10 shrink-0 items-center justify-center rounded-xl"
                          [style.backgroundColor]="sub.bg"
                        >
                          <img [src]="'/figma/home-v2/' + sub.icon" alt="" width="24" height="24" />
                        </span>
                        <span class="min-w-0">
                          <strong class="block text-[15px] text-navy">{{ sub.title }}</strong>
                          <span class="block truncate text-[13px] text-neutral-text">{{
                            sub.body
                          }}</span>
                        </span>
                      </a>
                    </li>
                  }
                </ul>
                <div class="my-1 h-px bg-neutral-line"></div>
                <a
                  [routerLink]="item.menu === 'tools' ? '/tools' : '/indicators'"
                  (click)="closeMenu()"
                  class="inline-flex px-3.5 pt-2.5 pb-2 font-plex text-[13.5px] font-bold text-purple hover:text-navy"
                >
                  {{ footerLabel[item.menu] }}
                </a>
              </div>
            </div>
          }
        </li>
      }
    }
  </ul>
</nav>
