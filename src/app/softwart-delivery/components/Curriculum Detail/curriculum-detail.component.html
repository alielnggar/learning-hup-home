<section
  class="flex w-full flex-col items-center justify-start gap-8 overflow-hidden bg-white px-4 py-16 md:px-10 lg:px-20 lg:py-20"
  dir="rtl"
>
  
  <div class="flex flex-col items-center justify-start gap-4 text-center mb-4" data-aos="fade-up">
    <h2
      class="text-3xl font-bold leading-tight text-navy md:text-4xl lg:text-5xl lg:leading-[62px]"
    >
      ماذا ستتعلم بالتفصيل داخل البرنامج
    </h2>
  </div>

  
  <div class="flex w-full max-w-[1000px] flex-col items-stretch justify-start gap-3">
    @for (module of curriculum(); track module.id; let i = $index) {
      <div
        data-aos="fade-up"
        [attr.data-aos-delay]="(i % 5) * 50"
        class="flex cursor-pointer flex-col justify-start items-end gap-4 overflow-hidden rounded-2xl px-5 py-5 transition-all duration-300 md:px-6 outline outline-1 -outline-offset-1"
        [ngClass]="
          openModuleId() === module.id
            ? 'bg-neutral-ground outline-violet-200'
            : 'bg-white outline-neutral-line hover:bg-neutral-ground'
        "
        (click)="toggleModule(module.id)"
      >
      
        <div class="flex w-full items-center justify-between">
          <div class="flex items-center justify-start gap-3.5">
            <span class="text-xs font-medium text-purple-600 font-mono">{{ module.id }}</span>
            <span class="text-lg font-bold font-sans text-navy md:text-xl">{{ module.title }}</span>
          </div>

          <div class="flex items-center justify-start gap-3">
            <span class="hidden text-xs font-medium text-neutral-arrow md:inline-block">{{
              module.count
            }}</span>
            <button
              class="flex size-7 items-center justify-center rounded-full outline outline-1 -outline-offset-1 transition-colors duration-300"
              [ngClass]="
                openModuleId() === module.id
                  ? 'bg-navy outline-navy text-white'
                  : 'bg-white outline-neutral-border text-navy'
              "
            >
              @if (openModuleId() === module.id) {
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                >
                  <path d="M5 12h14" />
                </svg>
              } @else {
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                >
                  <path d="M12 5v14M5 12h14" />
                </svg>
              }
            </button>
          </div>
        </div>

      
        @if (openModuleId() === module.id) {
          <div
            class="flex w-full flex-col justify-start items-start gap-3 pr-4 md:pr-10 pt-2 animate-fade-in"
          >
            @for (lesson of module.lessons; track lesson) {
              <div class="flex items-center justify-start gap-2.5">
                <div class="size-1.5 rounded-full bg-purple-600 shrink-0"></div>
                <span
                  class="text-right text-sm font-normal leading-6 text-neutral-text md:text-[15px]"
                  >{{ lesson }}</span
                >
              </div>
            }
          </div>
        }
      </div>
    }
  </div>

  
  <div class="mt-4 flex w-full justify-center" data-aos="zoom-in">
    <button
      (click)="buyNow()"
      class="inline-flex h-14 items-center cursor-pointer justify-center gap-4 rounded-full bg-navy px-2 pr-6 transition-colors hover:bg-purple-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-600"
    >
      <span class="text-base font-bold text-white">اشترِ البرنامج الأن</span>
      <div
        class="flex h-10 items-center justify-center rounded-full px-4 outline outline-1 -outline-offset-1 "
      >
        <span class="text-lg font-bold text-white" dir="ltr">$390</span>
      </div>
    </button>
  </div>
</section>
