<section class="flex w-full items-center justify-center overflow-hidden bg-white px-4 py-16 md:px-10 lg:px-20 lg:py-24" dir="rtl">
  <div class="flex w-full max-w-[1200px] flex-col items-start justify-between gap-12 lg:flex-row lg:gap-16">
    
  
    <div class="flex w-full flex-col items-start justify-start gap-4 lg:w-1/3 lg:sticky lg:top-24" data-aos="fade-left">
      <h2 class="text-4xl font-bold leading-tight text-navy md:text-5xl">أسئلةٌ قبل أن تبدأ</h2>
      <p class="text-base font-normal leading-8 text-neutral-text">
        لم تجد إجابتك؟ فريقنا يردّ خلال يوم عمل.
      </p>
      <button 
        (click)="contactUs()"
        class="mt-2 inline-flex items-center justify-center cursor-pointer rounded-2xl bg-white px-8 py-3.5 outline outline-1 -outline-offset-1 outline-neutral-border shadow-sm transition-colors hover:bg-neutral-ground"
      >
        <span class="text-base font-bold text-navy">تواصل معنا</span>
      </button>
    </div>

   
    <div class="flex w-full flex-col items-stretch justify-start gap-3 lg:w-2/3">
      @for (faq of faqs(); track faq.question; let i = $index) {
        <div 
          data-aos="fade-up"
          [attr.data-aos-delay]="(i % 6) * 50"
          class="flex w-full cursor-pointer flex-col items-end justify-start gap-4 overflow-hidden rounded-2xl px-5 py-5 transition-all duration-300 md:px-7 md:py-6 outline outline-1 -outline-offset-1"
          [ngClass]="openId() === i ? 'bg-neutral-ground outline-neutral-border' : 'bg-white outline-neutral-line hover:bg-neutral-ground'"
          (click)="toggleFaq(i)"
        >
          <div class="flex w-full items-center justify-between gap-4">
            <h3 class="text-right text-base font-bold leading-7 text-navy md:text-lg">
              {{ faq.question }}
            </h3>
            
            <div 
              class="flex size-8 shrink-0 items-center justify-center rounded-full outline outline-1 -outline-offset-1 transition-colors duration-300 mr-2"
              [ngClass]="openId() === i ? 'bg-purple-600 text-white outline-purple-600' : 'bg-white text-neutral-arrow outline-neutral-line'"
            >
              @if (openId() === i) {
                <span class="text-xl font-bold mb-1">-</span>
              } @else {
                <span class="text-xl font-bold mb-1">+</span>
              }
            </div>
          </div>

          @if (openId() === i) {
            <div class="w-full text-right animate-fade-in pt-2">
              <p class="text-sm font-normal leading-7 text-neutral-text md:text-base">
                {{ faq.answer }}
              </p>
            </div>
          }
        </div>
      }
    </div>

  </div>
</section>
