<section
  class="flex w-full flex-col items-center justify-center overflow-hidden bg-white px-4 py-16 md:px-10 lg:px-20"
  dir="rtl"
>
  <div
    class="relative flex w-full max-w-[1200px] flex-col items-center justify-start gap-8 overflow-hidden rounded-[32px] bg-gradient-to-l from-purple-600 to-violet px-6 py-12 md:px-12 md:py-16 shadow-xl"
    data-aos="zoom-in"
  >
    <div
      class="pointer-events-none absolute -left-[160px] -top-[200px] size-[520px] rounded-full border-2 border-white/10"
    ></div>
    <div
      class="pointer-events-none absolute -left-[60px] -top-[110px] size-80 rounded-full border-2 border-white/10"
    ></div>

    <h2 class="relative z-10 text-center text-3xl font-bold text-white md:text-4xl">
      ماذا يتضمّن البرنامج؟
    </h2>

    <div
      class="relative z-10 mt-2 grid w-full grid-cols-1 overflow-hidden rounded-[20px] bg-white/5 outline outline-1 -outline-offset-1 outline-white/30 md:grid-cols-2 lg:grid-cols-3 backdrop-blur-sm"
    >
      @for (item of includes(); track item.title; let i = $index) {
        <div
          class="flex items-center justify-start gap-4 border-white/10 p-5 md:p-6 transition-colors hover:bg-white/10"
          [ngClass]="{
            'border-b md:border-b': true,
            'md:border-l lg:border-l-0': i % 2 === 0,
            'lg:border-l': i % 3 !== 2,
          }"
        >
          <div class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-white/10">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              class="text-white"
              [innerHTML]="item.iconSvg"
            ></svg>
          </div>

          <div class="flex flex-col items-start gap-1">
            <span class="text-base font-bold text-white">{{ item.title }}</span>
            <span class="text-sm font-normal text-white/80">{{ item.desc }}</span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
