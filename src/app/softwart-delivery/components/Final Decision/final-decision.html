<section
  class="flex w-full flex-col items-center justify-start gap-12 overflow-hidden bg-gray-50 px-4 py-16 md:px-10 lg:px-20 lg:py-24"
  dir="rtl"
>
  <div class="flex flex-col items-center justify-start gap-4 text-center" data-aos="fade-up">
    <div
      class="inline-flex items-center justify-start overflow-hidden rounded-full bg-violet-100 px-4 py-1.5 shadow-sm"
    >
      <span class="text-xs font-bold text-purple-600">القرار</span>
    </div>
    <h2 class="text-3xl font-bold leading-tight text-navy md:text-5xl lg:text-[60px]">
      أمامك الآن طريقان
    </h2>
    <p class="text-base font-normal leading-8 text-neutral-text md:text-lg">
      وصلت إلى آخر الصفحة، وهذا يعني أنّ الأمر يعنيك فعلًا.
    </p>
  </div>

  <div class="flex w-full max-w-[1100px] flex-col items-stretch justify-center gap-8 md:flex-row">
   

   
    <div
      data-aos="fade-right"
      data-aos-delay="150"
      class="flex flex-1 flex-col items-start justify-start gap-6 rounded-3xl bg-gradient-to-br from-violet-50 via-violet-100 to-sky-100 p-8 outline outline-1 -outline-offset-1 outline-violet-200 shadow-md md:p-10"
    >
      <div
        class="inline-flex items-center justify-start rounded-full bg-white px-4 py-1.5 shadow-sm"
      >
        <span class="text-xs font-bold text-purple-600">الطريق الثاني</span>
      </div>

      <h3 class="text-2xl font-bold text-navy md:text-3xl">أن تبدأ معنا الآن</h3>

      <div class="mt-2 flex flex-col gap-4">
        @for (item of pathTwo(); track item) {
          <div class="flex items-center justify-start gap-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="17"
              height="17"
              viewBox="0 0 17 17"
              fill="none"
            >
              <path
                d="M14.1663 4.25L6.37467 12.0417L2.83301 8.5"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke="#746DC6"
              />
            </svg>
            <span class="text-base font-medium text-navy">{{ item }}</span>
          </div>
        }
      </div>
    </div>

    <div
      data-aos="fade-left"
      class="flex flex-1 flex-col items-start justify-start gap-6 rounded-3xl bg-[#F5F3F9] p-8 outline outline-1 -outline-offset-1 outline-neutral-border md:p-10"
    >
      <div
        class="inline-flex items-center justify-start rounded-full bg-white px-4 py-1.5 shadow-sm"
      >
        <span class="text-xs font-bold text-[#4A4663]">الطريق الأول</span>
      </div>

      <h3 class="text-2xl font-bold  md:text-3xl text-[#4A4663]">أن تستمرّ كما أنت</h3>

      <div class="mt-2 flex flex-col gap-4">
        @for (item of pathOne(); track item) {
          <div class="flex items-center justify-start gap-3">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
            >
              <path
                d="M12 4L8 8M8 8L4 12M8 8L4 4M8 8L12 12"
                stroke-width="1.46667"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke="#4A4566"
              />
            </svg>
            <span class="text-base font-normal text-[#4A4566]">{{ item }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</section>
