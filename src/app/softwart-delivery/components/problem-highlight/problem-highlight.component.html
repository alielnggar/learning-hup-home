
<section #sectionContainer class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-hidden bg-navy px-4 md:px-10 lg:px-20" dir="rtl">
 
  <div class="pointer-events-none absolute -left-[200px] -top-[220px] size-[620px] rounded-full bg-radial from-violet-400/50 to-violet-400/0 blur-3xl"></div>
  <div class="pointer-events-none absolute -right-[150px] bottom-[100px] size-[560px] rounded-full bg-radial from-sky-300/30 to-sky-300/0 blur-3xl"></div>

 
  <div class="relative z-10 mb-8 inline-flex items-center justify-center rounded-full bg-white/10 px-4 py-1.5 shadow-sm outline outline-1 -outline-offset-1 outline-white/20 backdrop-blur-sm" data-aos="fade-down">
    <span class="text-xs font-bold text-violet-100">المشكلة</span>
  </div>

 
  <div #textContainer class="relative z-10 flex max-w-[900px] flex-col items-center justify-center gap-4 text-center">
    
    @for (line of lines(); track $index) {
      <div class="flex flex-wrap items-center justify-center gap-x-2 md:gap-x-3 text-3xl font-bold leading-relaxed text-white md:text-5xl lg:text-[40px] lg:leading-tight">
        @for (fragment of line.fragments; track fragment.text) {
          
          @if (!fragment.isHighlighted) {
            @for (word of fragment.text.split(' '); track $index) {
              @if (word.trim() !== '') {
                <span class="reveal-word inline-block">{{ word }}</span>
              }
            }
          } 
          @else {
            <div class="reveal-word inline-flex items-center justify-center rounded-xl bg-purple-600/30 px-3 py-1 shadow-inner md:px-4 md:py-2">
              <span class="text-white/90">{{ fragment.text }}</span>
            </div>
          }
          
        }
      </div>
    }

  </div>


  <div class="relative z-10 mt-12 h-1 w-20 rounded-full bg-gradient-to-r from-violet to-sky-300"></div>

</section>
