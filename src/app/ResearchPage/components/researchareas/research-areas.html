<section class="mx-auto flex max-w-[1440px] flex-col gap-10 px-4 pt-[110px] md:px-20" dir="rtl">
  <div class="flex items-end justify-between gap-6" data-aos="fade-up">
    <div class="flex flex-col items-start gap-3.5">
      <span
        class="rounded-full bg-violet-100 px-[13px] py-1.5 text-[13px] font-medium text-purple-600"
        >محاور البحث</span
      >
      <h2 class="text-[32px] font-bold leading-[1.25] text-navy md:text-[46px]">
        المجالات التي نبحث فيها
      </h2>
    </div>
    <div class="flex gap-2.5">
      <button
        (click)="scrollList(1)"
        class="flex size-[52px] cursor-pointer items-center justify-center rounded-full border border-neutral-line bg-white text-navy transition-all duration-300 hover:border-transparent hover:bg-navy hover:text-white"
      >
        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
      <button
        (click)="scrollList(-1)"
        class="flex size-[52px] cursor-pointer items-center justify-center rounded-full border border-neutral-line bg-white text-navy transition-all duration-300 hover:border-transparent hover:bg-navy hover:text-white"
      >
        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
          />
        </svg>
      </button>
    </div>
  </div>

  <div
    #scrollContainer
    class="-mx-4 flex snap-x snap-mandatory gap-4 overflow-x-auto px-4 pb-2 scrollbar-hide md:mx-0 md:px-0"
  >
    @for (area of areas(); track area.n; let i = $index) {
      <button
        type="button"
        data-aos="fade-up"
        [attr.data-aos-delay]="(i % 5) * 100"
        (click)="domainSelected.emit(area.title)"
        class="group flex cursor-pointer h-[380px] w-[262px] shrink-0 snap-start flex-col items-start rounded-[26px] border p-6 text-right transition-all duration-300 hover:-translate-y-1 hover:shadow-lg bg-white border-neutral-line hover:bg-navy hover:border-transparent"
      >
        <span
          class="text-[13px] text-neutral-arrow transition-colors duration-300 group-hover:text-violet-200"
          >{{ area.n }}</span
        >
        <span
          class="text-[22px] font-bold leading-[1.4] text-navy transition-colors duration-300 group-hover:text-white"
          >{{ area.title }}</span
        >

        <span
          class="mt-3 flex size-[52px] items-center justify-center rounded-2xl transition-colors duration-300"
          [ngClass]="area.tint"
          [innerHTML]="area.icon"
        >
        </span>
        <span
          class="mt-[10px] text-[14.5px] leading-[1.8] text-neutral-text transition-colors duration-300 group-hover:text-white/75"
          >{{ area.body }}</span
        >
        <span class="mt-[22px] flex w-full items-center justify-between">
          <span
            class="text-[13.5px] text-neutral-text transition-colors duration-300 group-hover:text-white/75"
            >{{ area.count }}</span
          >
          <span
            class="flex size-11 items-center justify-center rounded-full bg-white text-white transition-all duration-300 group-hover:-rotate-45 group-hover:bg-white group-hover:text-navy"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
            >
              <path
                d="M12.75 5.25L5.25 12.75M12.75 12V5.25H6"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke="#4A4566"
              />
            </svg>
          </span>
        </span>
      </button>
    }
  </div>
</section>
