<section
  id="archive"
  class="mx-auto flex max-w-[1440px] scroll-mt-28 flex-col gap-10 px-4 pt-[110px] pb-[50px] md:px-20"
  dir="rtl"
>
  <div class="flex flex-col items-center gap-3.5" data-aos="fade-up">
    <h2 class="text-[32px] leading-[1.25] font-bold text-navy md:text-[46px]">كلّ الأبحاث</h2>
    <p class="max-w-[560px] text-[17px] leading-[1.8] text-[#4a4566]">
      كلّ إصدار متاحٌ بملخّصٍ مجاني، والنص الكامل ضمن الاشتراك.
    </p>
  </div>

  <div
    class="flex flex-col gap-4 border-b border-[#e6e3f2] pb-[22px] lg:flex-row lg:items-center lg:justify-between"
    data-aos="fade-up"
    data-aos-delay="100"
  >
    <div
      class="-mx-4 flex gap-1.5 overflow-x-auto px-4 [scrollbar-width:none] md:mx-0 md:flex-wrap md:px-0"
    ></div>
  </div>

  <ul class="flex flex-col mt-4">
    @for (p of papers; track p.title; let i = $index) {
      <li class="border-b border-[#e6e3f2]" data-aos="fade-up" [attr.data-aos-delay]="(i % 5) * 50">
        <button
          type="button"
          (click)="openPaywall.emit({ kind: p.type, title: p.title })"
          class="group flex w-full flex-col gap-4 rounded-[20px] px-2 py-[30px] text-right transition-[background-color,padding] duration-300 hover:bg-[#f7f6fc] md:flex-row md:items-start md:gap-9 md:hover:px-[22px]"
        >
          <span class="flex shrink-0 flex-row gap-3 md:w-[120px] md:flex-col md:gap-1.5 md:pt-1">
            <span class="text-sm text-[#8e89ad]">{{ p.date }}</span>
            <span class="text-[13.5px] font-medium text-purple-600">{{ p.type }}</span>
          </span>

          <span class="flex min-w-0 flex-1 flex-col gap-2">
            <span
              class="text-[19px] leading-[1.5] font-bold text-navy transition-colors group-hover:text-purple-600 md:text-[22px]"
              >{{ p.title }}</span
            >
            <span class="text-[15px] leading-[1.8] text-[#4a4566]">{{ p.body }}</span>
            <span class="text-[13px] text-[#8e89ad]">فريق DPC للبحث والابتكار</span>
          </span>

          <span class="shrink-0 md:w-[160px] flex items-start md:pt-1">
            <span
              class="inline-flex rounded-full bg-[#e4e2f6] px-[13px] py-1.5 text-[13px] font-medium text-purple-600"
              >{{ p.domain }}</span
            >
          </span>

          <span
            class="flex shrink-0 flex-row items-center gap-3 md:w-[170px] md:flex-col md:items-start md:gap-2.5 md:pt-1"
          >
            <span class="relative flex h-[30px] items-center">
              <span
                class="rounded-full bg-[#edf4e8] px-[13px] py-1.5 text-[13px] font-medium text-[#56743f] transition-opacity duration-200 group-hover:opacity-0"
                >{{ p.access }}</span
              >

              <span
                class="absolute left-0 flex size-[30px] scale-75 items-center justify-center rounded-full bg-navy text-white opacity-0 transition-[opacity,transform] duration-200 group-hover:scale-100 group-hover:opacity-100"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 18 18"
                  fill="none"
                >
                  <path
                    d="M12.75 5.25L5.25 12.75M12.75 12V5.25H6"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke="white"
                  />
                </svg>
              </span>
            </span>
            <span class="text-[13.5px] text-[#4a4566]">{{ p.format }}</span>
          </span>
        </button>
      </li>
    }
    @if (papers.length === 0) {
      <li class="py-16 text-center text-[17px] text-[#8e89ad]" data-aos="fade-in">
        لا توجد أبحاث حالياً.
      </li>
    }
  </ul>
</section>
