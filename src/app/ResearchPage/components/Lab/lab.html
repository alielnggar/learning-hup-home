<section class="mx-auto flex max-w-[1440px] flex-col gap-10 px-4 pt-[110px] md:px-20" dir="rtl">
  <div class="flex flex-wrap items-center justify-center gap-6" data-aos="fade-up">
    <div class="flex flex-col items-center gap-3.5 text-center">
     <span
        class="rounded-full bg-violet-100 px-[13px] py-1.5 text-[13px] font-medium text-purple-600"
        >المعمل</span
      >
      <h2 class="text-[32px] leading-[1.25] font-bold text-navy md:text-[46px]">قيد البحث الآن</h2>
      <p class="max-w-[520px] text-[17px] leading-[1.8] text-[#4a4566]">
        أسئلةٌ نعمل عليها حاليًا. تابعها، أو شارك فيها بخبرتك وبياناتك.
      </p>
    </div>
  </div>

  <div class="grid gap-5 lg:grid-cols-3">
    @for (c of lab; track c.title; let i = $index) {
      <article
        class="group flex flex-col overflow-hidden rounded-[28px] border border-[#e6e3f2] bg-white transition-all duration-300 hover:shadow-[0_20px_40px_rgba(33,25,81,0.08)] hover:-translate-y-1 lg:h-auto"
        data-aos="fade-up"
        [attr.data-aos-delay]="i * 100"
      >
        <div class="h-[200px] w-full overflow-hidden">
          <img [src]="c.image" [alt]="c.title" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" />
        </div>
        
        <div class="flex flex-1 flex-col items-start p-7">
          <div class="flex w-full items-center justify-between gap-2">
            <span
              class="rounded-full px-[13px] py-1.5 text-[13px] font-medium"
              [ngClass]="c.domainCls"
              >{{ c.domain }}</span
            >
          </div>
          <h3 class="mt-[22px] text-[22px] leading-[1.5] font-bold text-navy">{{ c.title }}</h3>
          <p class="mt-3 text-[15px] leading-[1.8] text-[#4a4566]">{{ c.body }}</p>
         
        </div>
      </article>
    }
  </div>
</section>
