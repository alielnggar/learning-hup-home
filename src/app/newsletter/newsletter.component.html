<section class="mx-auto max-w-[1440px] px-4 py-[47px] md:px-6 xl:px-20" dir="rtl">
  <div class="flex flex-col gap-8 rounded-[32px] border border-neutral-line bg-navy px-6 py-8 md:px-11 md:py-10 lg:flex-row lg:items-center lg:justify-between transition-transform">
    
    <div class="flex flex-col items-start gap-2.5">
      <span class="rounded-full bg-violet-100/10 px-2.5 py-1 text-xs leading-[1.4] text-violet-100">
        النشرة
      </span>
      <h2 class="text-[26px] leading-[1.35] font-bold text-[#f0f3ff] md:text-[30px]">جديد المعرفة في رسالةٍ واحدة</h2>
      <ul class="flex flex-wrap gap-x-6 gap-y-2 pt-1.5">
        @for (b of benefits; track b) {
          <li class="flex items-center gap-2 text-[15px] text-accent-highlight">
            <svg class="text-sage w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            {{ b }}
          </li>
        }
      </ul>
    </div>

    <div class="w-full lg:w-[460px] relative">
      @if (status() === 'success') {
       
        <div @fadeSlide role="status" class="flex items-center gap-4 rounded-3xl bg-sage-ground px-5 py-5">
          <span @scaleSpring class="flex size-11 shrink-0 items-center justify-center rounded-full bg-sage text-white">
            <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6L9 17l-5-5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="flex flex-col gap-1">
            <span class="text-lg font-bold text-navy">تم الاشتراك</span>
            <span class="text-sm text-neutral-text">سيصلك الجديد على {{ email().trim() }}</span>
          </span>
        </div>
      } @else {
      
        <form @fadeSlide novalidate (submit)="onSubmit($event)" class="flex flex-col gap-3">
          <label class="text-sm font-bold text-[#f0f3ff]">
            اكتب بريدك، ويصلك الجديد أولًا بأول.
          </label>
          <div class="flex h-14 items-center gap-2 rounded-full border bg-white py-1.5 pr-[18px] pl-1.5 transition-[border-color,box-shadow] duration-300 focus-within:border-purple focus-within:shadow-[0_0_0_4px_rgba(116,109,198,0.15)]"
               [class.border-[#d64545]]="error()"
               [class.focus-within:border-[#d64545]]="error()"
               [class.focus-within:shadow-[0_0_0_4px_rgba(214,69,69,0.12)]]="error()"
               [class.border-neutral-line]="!error()">
            
            <input type="email" inputmode="email" autocomplete="email" placeholder="بريدك الإلكتروني"
                   [ngModel]="email()" (ngModelChange)="onEmailChange($event)" name="email"
                   [disabled]="status() === 'loading'"
                   class="min-w-0 flex-1 bg-transparent text-[15px] text-navy outline-none placeholder:text-neutral-arrow" />
            
            <button type="submit" [disabled]="status() === 'loading'"
                    class="relative flex h-11 shrink-0 items-center justify-center rounded-full bg-navy px-[22px] text-sm font-bold text-white transition-[background-color,transform] duration-300 hover:bg-[#150f3a] active:scale-[0.98] disabled:cursor-wait">
              <span [class.opacity-0]="status() === 'loading'">اشترك في النشرة</span>
              @if (status() === 'loading') {
                <span class="absolute inset-0 flex items-center justify-center">
                  <span class="size-5 animate-spin rounded-full border-2 border-white/30 border-t-white"></span>
                </span>
              }
            </button>
          </div>
          
          <div class="h-5">
            @if (error()) {
              <p @fadeSlide role="alert" class="text-[12.5px] text-[#c03a3a]">{{ error() }}</p>
            } @else {
              <p class="text-[12.5px] text-neutral-arrow">يمكنك إلغاء الاشتراك في أي وقت.</p>
            }
          </div>
        </form>
      }
    </div>

  </div>
</section>
