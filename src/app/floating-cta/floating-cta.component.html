@if (isVisible() && !isDismissed()) {
  <aside
    @slideUp
    aria-label="اشترك في الـHub"
    class="fixed inset-x-4 bottom-4 z-40 mx-auto max-w-[1040px] md:bottom-6"
    dir="rtl"
  >
    <div
      class="relative flex items-center justify-between gap-3 overflow-hidden rounded-full bg-navy py-2 pr-5 pl-2 shadow-[0_16px_20px_rgba(33,26,82,0.35)] md:py-3 md:pr-6 md:pl-6"
    >
      <span
        aria-hidden="true"
        class="pointer-events-none absolute inset-y-0 left-0 w-1/4 bg-gradient-to-r from-transparent via-[#8b79df8c] to-transparent blur-[2px] animate-shimmer"
      ></span>

      <p class="relative flex min-w-0 items-center gap-2.5 text-[15px] font-medium text-white">
        <span
          aria-hidden="true"
          class="size-2 shrink-0 rounded-full bg-violet shadow-[0_0_0_4px_rgba(173,123,233,0.25)]"
        ></span>
        <span class="truncate"
          >10 برامج · 80 حزمة · +1,300 قالب · كلّ الكتب والأبحاث والمؤشرات، باشتراكٍ واحد</span
        >
      </p>

      <div class="relative flex shrink-0 items-center gap-2">
        <a
          routerLink="/subscribe"
          class="inline-flex h-10 items-center rounded-full bg-white px-5 text-base font-medium text-navy shadow-[0_0_0_4px_rgba(173,123,233,0.25)] transition-colors hover:bg-[#f1eff9] md:h-12 md:px-6"
        >
          اشترك الآن
        </a>
        <button
          type="button"
          aria-label="إخفاء"
          (click)="dismiss()"
          class="flex size-8 items-center justify-center rounded-full text-white/80 transition-colors hover:bg-white/10 hover:text-white"
        >
          <svg
            class="w-3.5 h-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </aside>
}
