<section
  class="mx-auto flex max-w-[1440px] flex-col gap-16 px-4 py-20 md:px-6 lg:flex-row lg:items-start xl:px-20"
  dir="rtl"
>
  <div
    class="sticky top-28 flex flex-col items-start gap-3.5 lg:w-[380px] lg:shrink-0"
    data-aos="fade-up"
  >
    <span
      class="text-right text-xs font-medium tracking-wide text-violet-ink font-['thmanyah_serif_text']"
      >FAQ</span
    >
    <h2
      class="text-right text-[30px] font-bold leading-10 text-navy md:text-4xl font-['thmanyah_serif_text']"
    >
      أسئلة قبل أن تبدأ
    </h2>
    <p
      class="text-right text-base font-normal leading-7 text-neutral-text font-['thmanyah_serif_text']"
    >
      لم تجد إجابتك؟ فريقنا يرد عليك خلال يوم عمل.
    </p>
    <a
      href="#"
      class="mt-2 flex h-12 items-center justify-center rounded-full outline outline-[1.5px] outline-offset-[-1.5px] outline-neutral-border px-6 text-center text-base font-semibold leading-4 text-navy transition-colors hover:bg-neutral-ground font-['IBM_Plex_Sans_Arabic']"
    >
      تواصل معنا
    </a>
  </div>

  <div class="flex flex-1 flex-col border-t border-neutral-line">
    @for (faq of faqs; track faq.q; let i = $index) {
      <div
        class="flex flex-col items-start justify-start overflow-hidden border-b border-neutral-line px-1 py-5"
        data-aos="fade-up"
        [attr.data-aos-delay]="i * 50"
      >
        <button
          type="button"
          (click)="toggleFaq(i)"
          class="flex w-full cursor-pointer items-center justify-between gap-4 overflow-hidden outline-none"
        >
          <h3
            class="flex-1 text-right text-lg font-bold text-navy transition-colors hover:text-purple-600 font-['thmanyah_serif_text']"
          >
            {{ faq.q }}
          </h3>
          <div
            class="flex size-8 shrink-0 items-center justify-center rounded-full text-base font-bold transition-all duration-300 font-['thmanyah_serif_text']"
            [ngClass]="
              openIndex() === i
                ? 'bg-navy text-white outline-none'
                : 'text-purple-600 outline outline-1 outline-offset-[-1px] outline-neutral-border hover:bg-neutral-ground'
            "
          >
            {{ openIndex() === i ? '−' : '+' }}
          </div>
        </button>

        <div
          class="grid w-full transition-all  duration-300 ease-in-out"
          [class.grid-rows-[1fr]]="openIndex() === i"
          [class.grid-rows-[0fr]]="openIndex() !== i"
        >
          <div class="overflow-hidden">
            <p
              class="max-w-[640px] pt-3 text-right text-base font-normal leading-7 text-neutral-text opacity-100 transition-opacity duration-300 font-['thmanyah_serif_text']"
              [class.opacity-0]="openIndex() !== i"
            >
              {{ faq.a }}
            </p>
          </div>
        </div>
      </div>
    }
  </div>
</section>
