<section id="quesions-section"
  class="flex w-full flex-col items-center justify-start gap-11 overflow-hidden bg-gray-50 px-4 py-16 md:px-10 lg:px-20 lg:py-24"
  dir="rtl"
>
  
  <div class="flex flex-col items-center justify-start gap-4 text-center" data-aos="fade-up">
  
    <div
      class="inline-flex items-center justify-start overflow-hidden rounded-full bg-indigo-50 px-4 py-1.5 shadow-sm"
    >
      <span class="text-xs font-bold text-purple-600">أسئلة شائعة</span>
    </div>

    
    <h2
      class="text-3xl font-bold leading-tight text-navy md:text-4xl lg:text-5xl lg:leading-[60px]"
    >
      لديك بعض الأسئلة؟ دعنا نجيب عليها.
    </h2>
  </div>

  
  <div class="flex w-full max-w-[1000px] flex-col items-stretch justify-start gap-3">
    @for (faq of ques(); track faq.question; let i = $index) {
      <div
        data-aos="fade-up"
        [attr.data-aos-delay]="(i % 5) * 50"
        class="flex w-full cursor-pointer flex-col items-end justify-start gap-4 overflow-hidden rounded-2xl px-5 py-5 transition-all duration-300 md:px-7 md:py-6 outline outline-1 -outline-offset-1"
        [ngClass]="
          openId() === i
            ? 'bg-gradient-to-br from-purple-50 via-purple-100 to-purple-100 outline-violet-200'
            : 'bg-white outline-neutral-border hover:bg-neutral-ground'
        "
        (click)="toggleFaq(i)"
      >
      
        <div class="flex w-full items-center justify-between">
       
          <h3 class="text-right text-base font-bold leading-7 text-navy md:text-[19px]">
            {{ faq.question }}
          </h3>

         
          <div
            class="flex size-8 shrink-0 items-center justify-center rounded-full outline outline-1 -outline-offset-1 transition-colors duration-300 mr-4"
            [ngClass]="
              openId() === i
                ? 'bg-purple-600 text-white outline-purple-600'
                : 'bg-neutral-ground text-purple-600 outline-transparent'
            "
          >
            @if (openId() === i) {
         
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              >
                <path d="M5 12h14" />
              </svg>
            } @else {
         
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
              >
                <path d="M12 5v14M5 12h14" />
              </svg>
            }
          </div>
        </div>

        @if (openId() === i) {
          <div class="w-full text-right animate-fade-in">
            <p class="text-sm font-normal leading-8 text-neutral-text md:text-base">
              {{ faq.answer }}
            </p>
          </div>
        }
      </div>
    }
  </div>
</section>
