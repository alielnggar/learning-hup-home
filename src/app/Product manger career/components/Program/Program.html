<section
  class="flex w-full items-center justify-center overflow-hidden bg-white px-4 py-16 md:px-10 lg:px-20 lg:py-24"
  dir="rtl"
>
  
  <div
    class="flex w-full max-w-[1200px] flex-col-reverse items-center justify-between gap-12 lg:flex-row "
  >
   
    <div class="flex w-full flex-col items-center justify-center gap-10 lg:w-1/2 lg:items-start top-40">
  
      <div
        class="flex w-full flex-col items-start justify-center gap-4 text-right"
        data-aos="fade-right"
      >
        <div
          class="inline-flex items-center justify-start overflow-hidden rounded-full bg-violet-100 px-4 py-1.5"
        >
          <span class="text-xs font-bold text-purple-600">البرنامج</span>
        </div>

        <h2
          class="font-sans  font-bold leading-tight text-[#211951] md:text-5xl lg:text-[55px] w-[900px]"
          dir="ltr"
        >
          Product Manager Career Accelerator
        </h2>

        <p class="text-right text-lg font-normal leading-8 text-neutral-text">
          الدبلومة الشاملة التي تؤهّلك لتصبح Product Manager حقيقيًا، قادرًا على الربط بين:
        </p>
      </div>

      
      <div
        class="flex flex-wrap items-start justify-start gap-3.5"
        data-aos="fade-up"
        data-aos-delay="150"
        
      >
        @for (skill of skills(); track skill.name) {
          <div
            class="flex items-start justify-start gap-2.5 rounded-full bg-white px-6 py-3 border border-[1.5px] border-[#E2DCF2]   transition-transform hover:-translate-y-1"
          >
            <div class="size-2 rounded-full" [ngClass]="skill.color"></div>
            <span class="font-sans text-base font-bold text-navy">{{ skill.name }}</span>
          </div>
        }
      </div>

     
      <div
        class="flex w-full justify-center lg:justify-center "
        data-aos="fade-in"
        data-aos-delay="250"
      >
        <div class="flex size-10 items-center justify-center text-neutral-arrow right-80">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 5v14M19 12l-7 7-7-7" />
          </svg>
        </div>
      </div>

     
      <div
        data-aos="fade-up"
        data-aos-delay="350"
        class="flex w-[700px] flex-col items-center justify-start gap-3 rounded-3xl bg-gradient-to-br from-violet-50 via-violet-100 to-sky-100 px-6 py-8 text-center outline outline-1 -outline-offset-1 outline-violet-200 md:px-11"
      >
        <span class="text-lg font-medium leading-7 text-neutral-text md:text-xl">
          وتخرج من كلّ ذلك بقراراتٍ واضحة
        </span>
        <h3 class="text-2xl font-bold leading-relaxed text-navy md:text-[20px] lg:leading-[48px]">
          هذا هو الفرق بين شخصٍ «يعمل في المنتج» وشخصٍ «يقود المنتج».
        </h3>
      </div>
    </div>

   
    <div
      class="flex w-full justify-center lg:w-1/2 lg:justify-end"
      data-aos="fade-left"
      data-aos-delay="200"
    >
      <img
        class="relative h-auto w-full max-w-[448px] rounded-2xl object-cover -top-10 right-10"
        src="/products-manger-career/program.png"
        alt="Product Manager Career Accelerator"
        loading="lazy"
      />
    </div>
  </div>
</section>
