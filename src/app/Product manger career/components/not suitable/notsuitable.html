<section
  class="flex w-full flex-col items-center justify-start gap-11 overflow-hidden bg-orange-50 px-4 py-16 md:px-10 lg:px-20 lg:py-20"
  dir="rtl"
>
  
  <div class="flex flex-col items-center justify-start gap-4 text-center" data-aos="fade-up">
    <h2
      class="text-3xl font-bold leading-tight text-navy md:text-4xl lg:text-5xl lg:leading-[60px]"
    >
      البرنامج ليس مناسبًا لك إذا…
    </h2>
    <p class="max-w-[760px] text-base font-normal leading-8 text-neutral-text md:text-lg">
      نُفضّل أن نكون صريحين قبل أن تدفع. إن وجدت نفسك في إحدى هذه الحالات، فالبرنامج ليس الخيار
      الصحيح لك الآن.
    </p>
  </div>

 
  <div class="grid w-full max-w-[1200px] grid-cols-1 gap-5 md:grid-cols-2 lg:gap-6">
    @for (reason of reasons(); track reason.title; let i = $index) {
      <div
        data-aos="fade-up"
        [attr.data-aos-delay]="(i % 2) * 100"
        class="flex flex-col items-start justify-start gap-5 rounded-2xl bg-white p-6 outline outline-1 -outline-offset-1 outline-neutral-border  transition-transform duration-300 hover:-translate-y-1 sm:flex-row md:p-7"
      >
       
        <div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-orange-50">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 18 18"
            fill="none"
          >
            <path
              d="M13.5 4.5L9 9M9 9L4.5 13.5M9 9L4.5 4.5M9 9L13.5 13.5"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke="#9A5B00"
            />
          </svg>
        </div>

        
        <div class="flex flex-col items-start justify-start gap-3">
          <h3 class="text-xl font-bold leading-8 text-navy md:text-2xl md:leading-9">
            {{ reason.title }}
          </h3>
          <p class="text-base font-medium leading-8 text-neutral-text">
            {{ reason.desc }}
          </p>
        </div>
      </div>
    }
  </div>
</section>
