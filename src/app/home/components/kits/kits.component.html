<section class="mx-auto max-w-[1440px] px-4 pt-16 pb-10 md:px-6 xl:px-20" dir="rtl" data-aos="fade-up">
  
  <div class="mb-10 flex flex-col items-start justify-between gap-6 md:flex-row md:items-center">
    <div class="flex max-w-[800px] flex-col items-start gap-3">
      <span class="text-[13px] font-bold tracking-widest text-purple">الأدوات و الحزم</span>
      <h2 class="text-[34px] leading-[1.3] font-bold text-navy md:text-[44px]">
        80 حزمة عمل جاهزة، لكلّ مرحلةٍ في منتجك
      </h2>
      <p class="max-w-[700px] text-base leading-[1.75] text-neutral-text md:text-lg">
        كلّ حزمة مجموعة قوالب مرتّبة بتسلسل العمل، مع مثالٍ محلول وطريقة استخدام. تحمّلها وتبدأ على مشروعك مباشرة.
      </p>
    </div>
    <app-button href="/tools/kits" variant="outline" [arrow]="true" className="font-bold">
      تصفّح كلّ الحزم
    </app-button>
  </div>

  <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
    @for (kit of kits; track kit.image) {
      <a routerLink="/tools/kits"
         class="group overflow-hidden rounded-[18px] border border-[#d9dcf0] bg-white transition-shadow hover:shadow-lg">
        
        <div class="relative h-[163px] bg-[#f0f3ff]">
          <img [src]="'/figma/home-v2/' + kit.image" alt=""
               class="absolute inset-0 w-full h-full object-cover" />
        </div>
        
        <div class="flex min-h-[143px] flex-col px-[22px] pt-5 pb-[22px]">
          <h3 class="text-[19px] font-bold text-navy">{{ kit.title }}</h3>
          <p dir="ltr" class="mt-1 text-right font-latin text-[13px] text-[#6e6a8c]">
            {{ kit.en }}
          </p>
          <div class="mt-auto flex items-center justify-between border-t border-[#f0f3ff] pt-[14px] text-sm">
            <span class="text-neutral-text">16 قالبًا</span>
            <span class="font-medium text-purple-600 group-hover:underline">عرض الحزمة ←</span>
          </div>
        </div>
        
      </a>
    }
  </div>
  
</section>
