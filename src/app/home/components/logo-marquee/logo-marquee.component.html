<section class="px-4 pt-10 pb-4 md:px-6 xl:px-20 bg-[#F6F7F9]" dir="rtl" data-aos="fade-up">
  <h2 class="text-center text-[34px] font-bold text-[#211951] md:text-[46px]" dir="rtl">
    مؤسساتٌ وثقت بـ DPC
  </h2>
  
  <div class="marquee relative mx-auto mt-5 flex h-[152px] max-w-[1280px] items-center overflow-hidden" aria-label="مؤسسات وثقت بـ DPC">
    <div class="marquee-track flex w-max animate-marquee">
      
     
      <ul class="flex shrink-0 items-center">
        @for (logo of logos; track $index) {
          <li class="flex h-[80px] w-[190px] shrink-0 items-center justify-center">
            <img [src]="'/figma/home-v2/' + logo.file" alt="شعار مؤسسة شريكة"
                 [style.width.px]="logo.width" [style.height.px]="logo.height"
                 class="object-contain opacity-[.84] mix-blend-multiply" />
          </li>
        }
      </ul>

    
      <ul aria-hidden="true" class="flex shrink-0 items-center">
        @for (logo of logos; track $index) {
          <li class="flex h-[80px] w-[190px] shrink-0 items-center justify-center">
            <img [src]="'/figma/home-v2/' + logo.file" alt=""
                 [style.width.px]="logo.width" [style.height.px]="logo.height"
                 class="object-contain opacity-[.84] mix-blend-multiply" />
          </li>
        }
      </ul>
      
    </div>
    
    <div class="pointer-events-none absolute inset-y-0 left-0 w-[150px] bg-gradient-to-r  to-transparent"></div>
    <div class="pointer-events-none absolute inset-y-0 right-0 w-[150px] bg-gradient-to-l  to-transparent"></div>
  </div>
</section>
