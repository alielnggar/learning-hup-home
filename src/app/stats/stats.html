<section
  aria-label="أرقام DPC"
  class="relative z-10 mx-auto max-w-[1440px] px-4 pt-6 pb-10 md:px-6 lg:-mt-[200px] xl:px-20"
  dir="rtl"
>
  <div
    class="grid grid-cols-2 gap-y-6 px-2 py-7 drop-shadow-[0_10px_15px_rgba(33,26,82,0.06)] sm:grid-cols-3 lg:grid-cols-6 lg:gap-y-0 lg:px-6"
  >
    @for (stat of stats(); track stat.label; let i = $index) {
      <div
        class="relative flex flex-col items-center justify-center gap-1 px-2 text-center"
        [class.lg:before:absolute]="i > 0"
        [class.lg:before:top-1/2]="i > 0"
        [class.lg:before:right-0]="i > 0"
        [class.lg:before:h-14]="i > 0"
        [class.lg:before:w-px]="i > 0"
        [class.lg:before:-translate-y-1/2]="i > 0"
        [class.lg:before:bg-neutral-line]="i > 0"
      >
        <strong
          dir="ltr"
          class="text-[30px] leading-tight font-bold text-navy tabular-nums md:text-[36px]"
        >
          <span class="sr-only"> {{ stat.prefix || '' }}{{ stat.value | number }} </span>
          <span aria-hidden="true"> {{ stat.prefix || '' }}{{ stat.currentVal | number }} </span>
        </strong>
        <span class="text-sm text-[#5b5775]">{{ stat.label }}</span>
      </div>
    }
  </div>
</section>
